<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راديو القرآن الكريم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #0A0A0A;
            --card: #0C0C0C;
            --border: #2E2E2E;
            --btn: #1E1E1E;
            --text: #FFFFFF;
            --text2: #8A8A8A;
            --radius: 28px;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --font-quran: 'Amiri Quran', serif;
            --font-main: 'Cairo', 'Segoe UI', 'Tahoma', sans-serif;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            background: var(--bg);
            font-family: var(--font-main);
            color: var(--text);
            direction: rtl;
            user-select: none;
            -webkit-user-select: none;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(60, 60, 60, 0.1) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(40, 40, 40, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(30, 30, 30, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            height: 100%;
            max-height: 820px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 22px;
            gap: 18px;
        }

        .main-card {
            width: 100%;
            flex: 1;
            min-height: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 22px 20px 18px;
            position: relative;
            overflow: hidden;
        }

        .content-elements {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-height: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .content-elements.visible {
            opacity: 1;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .reader-top {
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 14px;
            color: var(--text);
            letter-spacing: 0.3px;
            text-decoration: underline;
            text-underline-offset: 5px;
            text-decoration-color: #555;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .reader-top:hover {
            opacity: 0.8;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text2);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.35s var(--ease), background 0.25s, border-color 0.25s;
            flex-shrink: 0;
        }
        .icon-btn:hover {
            transform: scale(1.08);
            background: #1E1E1E;
        }
        .icon-btn:active {
            transform: scale(0.92);
        }
        .icon-btn svg {
            width: 20px;
            height: 20px;
        }

        .mute-btn.muted {
            border-color: #5a1a1a;
            background: #2a1212;
        }
        .mute-btn.muted svg path,
        .mute-btn.muted svg line {
            stroke: #b91c1c;
        }

        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            width: 100%;
            flex: 1;
            justify-content: center;
            margin-top: -20px;
        }

        .surah-name {
            font-family: var(--font-quran);
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text);
            text-align: center;
            line-height: 1.3;
            margin: 0;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
        }

        .visualizer-container {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 20px;
            flex-shrink: 0;
        }
        .viz-bar {
            width: 4px;
            border-radius: 2px;
            background: #3a3a3a;
            transition: height 0.05s ease, background 0.1s;
            min-height: 4px;
            flex-shrink: 0;
        }
        .viz-bar.active {
            background: #9a9a9a;
        }

        .progress-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .progress-track {
            width: 100%;
            height: 6px;
            background: var(--btn);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #4a4a4a;
            border-radius: 3px;
            width: 0%;
            transition: width 0.4s var(--ease);
            position: relative;
        }
        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text2);
            letter-spacing: 0.5px;
            direction: ltr;
            font-weight: 400;
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 10, 0.45);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            border-radius: inherit;
            transition: opacity 0.6s var(--ease);
        }
        .play-overlay.hidden-overlay {
            opacity: 0;
            pointer-events: none;
        }

        .big-play-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: none;
            transition: transform 0.5s var(--ease), opacity 0.5s var(--ease), background 0.25s;
            position: relative;
            overflow: hidden;
        }
        .big-play-btn:hover {
            transform: scale(1.05);
            background: #333;
        }
        .big-play-btn:active {
            transform: scale(0.92);
        }
        .big-play-btn svg {
            width: 48px;
            height: 48px;
            fill: #fff;
            z-index: 2;
            position: relative;
        }

        .btn-spinner {
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            display: none;
        }
        .big-play-btn.loading .btn-spinner {
            display: block;
        }
        .btn-spinner::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        .big-play-btn.loading svg {
            display: none;
        }

        .footer-text {
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: #555;
            letter-spacing: 0.4px;
            padding: 8px 0 0;
            flex-shrink: 0;
            border-top: 1px solid var(--border);
            margin-top: 10px;
            font-family: var(--font-main);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s var(--ease);
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 92%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 28px 24px 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.45s var(--ease);
            position: relative;
            direction: rtl;
        }
        .modal-overlay.open .modal-panel {
            transform: scale(1) translateY(0);
        }
        .modal-close {
            position: absolute;
            top: 16px;
            left: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text2);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s, color 0.2s;
            z-index: 5;
        }
        .modal-close:hover {
            transform: rotate(90deg);
            color: #fff;
        }
        .modal-close svg {
            width: 18px;
            height: 18px;
        }
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 22px;
            letter-spacing: 0.5px;
            font-family: var(--font-main);
        }
        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .settings-item {
            background: #121212;
            border: 1px solid #2A2A2A;
            border-radius: 16px;
            padding: 16px 18px;
            transition: border-color 0.3s, background 0.3s;
        }
        .settings-item:hover {
            border-color: #3A3A3A;
            background: #161616;
        }
        .settings-label {
            font-size: 13px;
            color: #aaa;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .settings-link-row {
            display: flex;
            align-items: center;
            gap: 10px;
            direction: ltr;
            justify-content: flex-end;
        }
        .settings-link {
            color: #8a8a8a;
            font-size: 11px;
            text-decoration: none;
            word-break: break-all;
            flex: 1;
            font-family: monospace;
            background: #181818;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
            transition: border-color 0.2s, color 0.2s;
        }
        .settings-link:hover {
            border-color: #3a3a3a;
            color: #fff;
        }
        .copy-icon-btn {
            background: #1E1E1E;
            border: 1px solid #3a3a3a;
            color: #ccc;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            flex-shrink: 0;
        }
        .copy-icon-btn:hover {
            background: #2a2a2a;
            border-color: #4a4a4a;
            transform: translateY(-1px);
        }
        .copy-icon-btn:active {
            transform: scale(0.92);
        }
        .copy-icon-btn svg {
            width: 16px;
            height: 16px;
            stroke: #ccc;
            fill: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container { padding: 12px; gap: 10px; }
            .main-card { padding: 16px 14px 12px; border-radius: 24px; }
            .surah-name { font-size: 38px; }
            .big-play-btn { width: 80px; height: 80px; }
            .big-play-btn svg { width: 36px; height: 36px; }
            .icon-btn { width: 38px; height: 38px; }
            .icon-btn svg { width: 18px; height: 18px; }
            .visualizer-container { height: 60px; gap: 4px; }
            .viz-bar { width: 3px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card" id="mainCard">
            <div class="content-elements" id="contentElements">
                <div class="top-bar">
                    <div class="reader-top" id="readerTop">-</div>
                    <div class="top-actions">
                        <button class="icon-btn mute-btn" id="muteBtn" aria-label="كتم الصوت">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 5 6 9H2v6h4l5 4V5z" fill="none"/>
                                <line x1="22" y1="9" x2="16" y2="15" stroke="#8A8A8A" stroke-width="2"/>
                                <line x1="16" y1="9" x2="22" y2="15" stroke="#8A8A8A" stroke-width="2"/>
                            </svg>
                        </button>
                        <button class="icon-btn" id="settingsBtn" aria-label="الإعدادات">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="center-content">
                    <div class="surah-name" id="surahName">-</div>
                    <div class="visualizer-container" id="visualizer"></div>
                </div>

                <div class="progress-section">
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-row">
                        <span id="currentTime">00:00</span>
                        <span id="durationTime">00:00</span>
                    </div>
                </div>

                <div class="footer-text">راديو قرآن كريم - صدقة جارية على روحي - المطور كريم</div>
            </div>

            <div class="play-overlay" id="playOverlay">
                <button class="big-play-btn" id="bigPlayBtn" aria-label="تشغيل">
                    <div class="btn-spinner" id="btnSpinner"></div>
                    <svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="#fff"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-panel">
            <button class="modal-close" id="modalCloseBtn" aria-label="إغلاق">
                <svg viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <div class="modal-title">الإعدادات</div>
            <div class="settings-list">
                <div class="settings-item">
                    <div class="settings-label">رابط API البث</div>
                    <div class="settings-link-row">
                        <button class="copy-icon-btn" data-copy="api" aria-label="نسخ">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                        <a href="#" id="apiLink" target="_blank" class="settings-link"></a>
                    </div>
                </div>
                <div class="settings-item">
                    <div class="settings-label">رابط قائمة السور</div>
                    <div class="settings-link-row">
                        <button class="copy-icon-btn" data-copy="surahList" aria-label="نسخ">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                        <a href="https://jsonkeeper.com/b/P07SJ" target="_blank" class="settings-link">jsonkeeper.com/b/P07SJ</a>
                    </div>
                </div>
                <div class="settings-item">
                    <div class="settings-label">رابط المشروع</div>
                    <div class="settings-link-row">
                        <button class="copy-icon-btn" data-copy="github" aria-label="نسخ">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                        <a href="https://github.com/X5Coder/Quran-Website-API" target="_blank" class="settings-link">github.com/X5Coder/Quran-Website-API</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio"></audio>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzod3HSUKOjxabBDeovU5UfVAE-bnb5DptND0MBmhIBL_sb01MOtaBStNGt9dhybHwu/exec?key=KIMO";

        const audio = document.getElementById('audio');
        const playOverlay = document.getElementById('playOverlay');
        const bigPlayBtn = document.getElementById('bigPlayBtn');
        const btnSpinner = document.getElementById('btnSpinner');
        const readerTopEl = document.getElementById('readerTop');
        const surahNameEl = document.getElementById('surahName');
        const currentTimeSpan = document.getElementById('currentTime');
        const durationTimeSpan = document.getElementById('durationTime');
        const progressFill = document.getElementById('progressFill');
        const muteBtn = document.getElementById('muteBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const visualizerContainer = document.getElementById('visualizer');
        const contentElements = document.getElementById('contentElements');

        let currentData = null;
        let isMuted = false;
        let hasStarted = false;
        let isUpdating = false;
        let visualizerBars = [];
        let animationFrame = null;
        let vizRunning = false;
        let phases = [];
        let speeds = [];
        let amp = [];

        function initVisualizerBars() {
            visualizerContainer.innerHTML = '';
            visualizerBars = [];
            phases = [];
            speeds = [];
            amp = [];
            const barCount = 40;
            for (let i = 0; i < barCount; i++) {
                const bar = document.createElement('div');
                bar.className = 'viz-bar';
                bar.style.height = '4px';
                bar.style.width = '4px';
                visualizerContainer.appendChild(bar);
                visualizerBars.push(bar);
                phases.push(Math.random() * Math.PI * 2);
                speeds.push(0.006 + Math.random() * 0.01);
                amp.push(10 + Math.random() * 40);
            }
        }

        function startVisualizer() {
            if (!visualizerBars.length) return;
            vizRunning = true;
            function updateBars() {
                if (!vizRunning) return;
                const time = Date.now() * 0.001;
                visualizerBars.forEach((bar, i) => {
                    const v1 = Math.sin(time * speeds[i] * 200 + phases[i]) * 0.5 + 0.5;
                    const v2 = Math.sin(time * speeds[i] * 130 + phases[i] * 2) * 0.3 + 0.7;
                    const v3 = Math.sin(time * speeds[i] * 260 + phases[i] * 3) * 0.2 + 0.8;
                    const h = amp[i] * (0.6 * v1 + 0.25 * v2 + 0.15 * v3);
                    const clamped = Math.min(Math.max(h, 4), 70);
                    bar.style.height = clamped + 'px';
                    if (clamped > 30) bar.classList.add('active');
                    else bar.classList.remove('active');
                });
                animationFrame = requestAnimationFrame(updateBars);
            }
            updateBars();
        }

        function stopVisualizer() {
            vizRunning = false;
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            visualizerBars.forEach(bar => {
                bar.style.height = '4px';
                bar.classList.remove('active');
            });
        }

        function toSeconds(t) {
            if (!t) return 0;
            let p = t.split(':').map(Number);
            if (p.length === 3) return p[0]*3600 + p[1]*60 + p[2];
            if (p.length === 2) return p[0]*60 + p[1];
            return 0;
        }

        function toTime(sec) {
            if (isNaN(sec) || sec < 0) return "00:00";
            let h = Math.floor(sec / 3600);
            let m = Math.floor((sec % 3600) / 60);
            let s = Math.floor(sec % 60);
            if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            return `${m}:${s.toString().padStart(2,'0')}`;
        }

        function updateProgress() {
            if (audio && currentData && !isNaN(audio.currentTime)) {
                let currentSec = audio.currentTime;
                let durationSec = toSeconds(currentData.duration);
                let percent = durationSec > 0 ? (currentSec / durationSec) * 100 : 0;
                progressFill.style.width = percent + '%';
                currentTimeSpan.innerText = toTime(currentSec);
                durationTimeSpan.innerText = currentData.duration;
            }
        }

        async function fetchData() {
            try {
                let res = await fetch(API_URL + "&_=" + Date.now());
                if (!res.ok) throw new Error();
                let json = await res.json();
                if (json.error) throw new Error();
                return {
                    ok: true,
                    reader: json.اسم_القارئ || "غير معروف",
                    surah: json.اسم_السورة || "سورة",
                    url: json.رابط_السورة || "",
                    duration: json.مدة_السورة || "00:00",
                    current: json.الوقت_الحالي_للسورة || "00:00"
                };
            } catch(e) {
                return { ok: false };
            }
        }

        function updateUI(data) {
            readerTopEl.innerText = data.reader;
            surahNameEl.innerText = data.surah;
            durationTimeSpan.innerText = data.duration;
            let now = (audio && !isNaN(audio.currentTime)) ? audio.currentTime : toSeconds(data.current);
            currentTimeSpan.innerText = toTime(now);
            let percent = toSeconds(data.duration) > 0 ? (now / toSeconds(data.duration)) * 100 : 0;
            progressFill.style.width = percent + '%';

            if (data.url && audio.src !== data.url) {
                audio.src = data.url;
                audio.load();
                if (hasStarted && !audio.paused) {
                    audio.play().catch(() => {});
                }
            }
            bigPlayBtn.classList.remove('loading');
            bigPlayBtn.querySelector('svg').style.display = 'block';
            btnSpinner.style.display = 'none';
            contentElements.classList.add('visible');
        }

        function syncAudio() {
            if (!audio || !currentData) return;
            let serverTime = toSeconds(currentData.current);
            if (serverTime > 0 && Math.abs(audio.currentTime - serverTime) > 1.5) {
                audio.currentTime = serverTime;
                updateProgress();
            }
        }

        function startTimeLoop() {
            function update() {
                updateProgress();
                requestAnimationFrame(update);
            }
            update();
        }

        async function refresh() {
            if (isUpdating) return;
            isUpdating = true;
            let result = await fetchData();
            if (result.ok) {
                let newData = {
                    reader: result.reader,
                    surah: result.surah,
                    url: result.url,
                    duration: result.duration,
                    current: result.current
                };
                let wasPlaying = hasStarted && !audio.paused;
                let surahChanged = !currentData || currentData.surah !== newData.surah || currentData.url !== newData.url;
                if (surahChanged) {
                    currentData = newData;
                    if (audio.src !== newData.url) {
                        audio.src = newData.url;
                        audio.load();
                    }
                    if (audio.readyState >= 2) {
                        syncAudio();
                    }
                    if (wasPlaying && hasStarted) {
                        audio.play().catch(() => {});
                    }
                } else {
                    currentData = newData;
                    syncAudio();
                }
                updateUI(currentData);
            }
            isUpdating = false;
        }

        function initiatePlayback() {
            if (!currentData || !currentData.url) return;
            if (isMuted) {
                audio.volume = 1;
                isMuted = false;
                updateMuteIcon();
            }
            audio.play().then(() => {
                hasStarted = true;
                playOverlay.classList.add('hidden-overlay');
                setTimeout(() => { playOverlay.style.display = 'none'; }, 600);
                startVisualizer();
            }).catch(() => {
                setTimeout(() => audio.play().then(() => {
                    hasStarted = true;
                    playOverlay.classList.add('hidden-overlay');
                    setTimeout(() => { playOverlay.style.display = 'none'; }, 600);
                    startVisualizer();
                }).catch(() => {
                    playOverlay.classList.remove('hidden-overlay');
                    bigPlayBtn.classList.remove('loading');
                    bigPlayBtn.querySelector('svg').style.display = 'block';
                    btnSpinner.style.display = 'none';
                }), 300);
            });
        }

        bigPlayBtn.addEventListener('click', () => {
            if (!currentData || !currentData.url) {
                bigPlayBtn.classList.add('loading');
                bigPlayBtn.querySelector('svg').style.display = 'none';
                btnSpinner.style.display = 'block';
                refresh().then(() => {
                    if (currentData && currentData.url) {
                        initiatePlayback();
                    } else {
                        setTimeout(() => {
                            if (currentData && currentData.url) initiatePlayback();
                            else {
                                bigPlayBtn.classList.remove('loading');
                                bigPlayBtn.querySelector('svg').style.display = 'block';
                                btnSpinner.style.display = 'none';
                            }
                        }, 2000);
                    }
                });
            } else {
                initiatePlayback();
            }
        });

        function updateMuteIcon() {
            if (isMuted) {
                muteBtn.classList.add('muted');
            } else {
                muteBtn.classList.remove('muted');
            }
        }

        muteBtn.addEventListener('click', () => {
            if (!audio) return;
            if (!isMuted) {
                audio.volume = 0;
                isMuted = true;
            } else {
                audio.volume = 1;
                isMuted = false;
            }
            updateMuteIcon();
        });

        readerTopEl.addEventListener('click', () => {
            if (currentData && currentData.reader) {
                navigator.clipboard.writeText(currentData.reader).catch(() => {});
            }
        });

        function openModal() {
            settingsModal.classList.add('open');
        }
        function closeModal() {
            settingsModal.classList.remove('open');
        }
        settingsBtn.addEventListener('click', openModal);
        modalCloseBtn.addEventListener('click', closeModal);
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeModal();
        });

        document.querySelectorAll('.copy-icon-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const key = btn.getAttribute('data-copy');
                let textToCopy = '';
                if (key === 'api') textToCopy = API_URL;
                else if (key === 'surahList') textToCopy = 'https://jsonkeeper.com/b/P07SJ';
                else if (key === 'github') textToCopy = 'https://github.com/X5Coder/Quran-Website-API';
                if (textToCopy) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        btn.style.borderColor = '#4a4a4a';
                        setTimeout(() => btn.style.borderColor = '#3a3a3a', 600);
                    }).catch(() => {
                        const textArea = document.createElement('textarea');
                        textArea.value = textToCopy;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                    });
                }
            });
        });

        function setupSettings() {
            const apiLink = document.getElementById('apiLink');
            apiLink.href = API_URL;
            apiLink.innerText = API_URL.length > 50 ? API_URL.substring(0, 47) + '...' : API_URL;
        }

        audio.addEventListener('ended', () => {
            hasStarted = false;
            playOverlay.style.display = 'flex';
            playOverlay.classList.remove('hidden-overlay');
            stopVisualizer();
            refresh();
        });
        audio.addEventListener('playing', () => { startVisualizer(); });
        audio.addEventListener('pause', () => { stopVisualizer(); });
        audio.addEventListener('timeupdate', () => { updateProgress(); });
        audio.addEventListener('canplay', () => { syncAudio(); });

        async function init() {
            initVisualizerBars();
            setupSettings();
            startTimeLoop();
            bigPlayBtn.classList.add('loading');
            bigPlayBtn.querySelector('svg').style.display = 'none';
            btnSpinner.style.display = 'block';
            await refresh();
            setInterval(refresh, 25000);
        }
        init();
    </script>
</body>
</html>
